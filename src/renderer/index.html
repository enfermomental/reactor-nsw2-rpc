<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'none'">
    <title>NSW2 Presence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <svg class="sprite" width="0" height="0" aria-hidden="true">
        <defs>
            <symbol id="i-console" viewBox="0 0 48 32">
                <rect x="1.5" y="3" width="9" height="26" rx="4.5" fill="currentColor" opacity=".55"/>
                <rect x="37.5" y="3" width="9" height="26" rx="4.5" fill="currentColor" opacity=".55"/>
                <rect x="11.5" y="3" width="25" height="26" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
                <circle cx="6" cy="10" r="1.6" fill="var(--bg, #fff)"/>
                <circle cx="42" cy="20" r="1.6" fill="var(--bg, #fff)"/>
            </symbol>
            <symbol id="i-gear" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
            <symbol id="i-wifi" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.5 1.5 8.7a15 15 0 0 1 21 0z"/></symbol>
            <symbol id="i-discord" viewBox="0 0 24 24"><path fill="currentColor" d="M5 4h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6l-5 3.5V18H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm4 8.6a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zm6 0a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2z"/></symbol>
            <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
            <symbol id="i-hourglass" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></symbol>
            <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
            <symbol id="i-trail" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.2 5.8 6.3.4-4.9 4 1.6 6.1L12 15.4l-5.2 3.4 1.6-6.1-4.9-4 6.3-.4z"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
            <symbol id="i-close" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
            <symbol id="i-min" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 12h12"/></symbol>
            <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
            <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
            <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
        </defs>
    </svg>

    <div class="app" id="app">
        <header class="topbar">
            <div class="user" id="topUser"></div>
            <div class="drag"></div>
            <div class="status-icons">
                <span class="clock" id="clock">--:--</span>
                <span class="pill" id="discordPill" title="Discord"></span>
                <svg class="ico wifi" id="wifiIcon"><use href="#i-wifi"/></svg>
                <div class="winctl">
                    <button class="winbtn" data-win="minimize" title="Minimizar"><svg class="ico"><use href="#i-min"/></svg></button>
                    <button class="winbtn" data-win="toggleMaximize" title="Maximizar"><svg class="ico"><use href="#i-max"/></svg></button>
                    <button class="winbtn close" data-win="close" title="Cerrar"><svg class="ico"><use href="#i-close"/></svg></button>
                </div>
            </div>
        </header>

        <main class="view home" id="homeView">
            <section class="hero" id="hero"></section>
            <section class="lower">
                <div class="shelf">
                    <div class="shelf-head">
                        <span class="shelf-title">Jugado recientemente</span>
                        <span class="shelf-caption" id="shelfCaption"></span>
                    </div>
                    <div class="shelf-row" id="shelf"></div>
                </div>
                <div class="dc-card" id="discordPreview"></div>
            </section>
        </main>

        <main class="view settings hidden" id="settingsView">
            <nav class="snav" id="settingsNav"></nav>
            <div class="spanel" id="settingsPanel"></div>
        </main>

        <footer class="footer">
            <div class="foot-left">
                <svg class="ico console"><use href="#i-console"/></svg>
                <span id="footStatus">Iniciando…</span>
            </div>
            <div class="foot-right" id="footHints"></div>
        </footer>

        <div class="toast hidden" id="toast"></div>
    </div>

    <script src="app.js" type="module"></script>
</body>
</html>
